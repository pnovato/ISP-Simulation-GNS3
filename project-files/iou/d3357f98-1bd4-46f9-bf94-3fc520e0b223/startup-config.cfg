
!
version 17.12
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname R2
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
!
!
clock timezone WET 0 0
no ip icmp rate-limit unreachable
!
!
!
!
!
!
!
!
!
!
no ip domain lookup
no ip cef
login on-success log
no ipv6 cef
!
!
!
!
!
!
!
!
multilink bundle-name authenticated
!
!
crypto pki trustpoint TP-self-signed-2048005
 enrollment selfsigned
 subject-name cn=IOS-Self-Signed-Certificate-2048005
 revocation-check none
 rsakeypair TP-self-signed-2048005
 hash sha256
!
!
crypto pki certificate chain TP-self-signed-2048005
 certificate self-signed 01 nvram:IOS-Self-Sig#1.cer
!
!
memory free low-watermark processor 55011
!
!
spanning-tree mode rapid-pvst
!
!
!
!
!
!
!
! 
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 ip address 2.2.2.2 255.255.255.255
!
interface Ethernet0/0
 ip address 10.20.11.2 255.255.255.0
 ip ospf network point-to-point
 ip ospf 1 area 1
!
interface Ethernet0/1
 ip address 10.20.10.2 255.255.255.0
 ip ospf 1 area 0
!
interface Ethernet0/2
 no ip address
 shutdown
!
interface Ethernet0/3
 no ip address
 shutdown
!
interface Ethernet1/0
 no ip address
 shutdown
!
interface Ethernet1/1
 no ip address
 shutdown
!
interface Ethernet1/2
 no ip address
 shutdown
!
interface Ethernet1/3
 no ip address
 shutdown
!
interface Serial2/0
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial2/1
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial2/2
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial2/3
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial3/0
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial3/1
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial3/2
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial3/3
 no ip address
 shutdown
 serial restart-delay 0
!
router ospf 1
 network 2.2.2.2 0.0.0.0 area 1
!
router bgp 12353
 bgp log-neighbor-changes
 neighbor 1.1.1.1 remote-as 12353
 neighbor 1.1.1.1 update-source Loopback0
 neighbor 3.3.3.3 remote-as 12353
 neighbor 3.3.3.3 update-source Loopback0
 neighbor 4.4.4.4 remote-as 12353
 neighbor 4.4.4.4 update-source Loopback0
 neighbor 5.5.5.5 remote-as 12353
 neighbor 5.5.5.5 update-source Loopback0
 !
 address-family ipv4
  network 2.2.2.2 mask 255.255.255.255
  neighbor 1.1.1.1 activate
  neighbor 3.3.3.3 activate
  neighbor 4.4.4.4 activate
  neighbor 5.5.5.5 activate
 exit-address-family
!
ip forward-protocol nd
!
ip tcp synwait-time 5
!
ip http server
ip http secure-server
ip ssh bulk-mode 131072
!
!
ip prefix-list EXTERNAS seq 5 permit 192.168.0.0/16 le 32
ip prefix-list EXTERNAS seq 10 permit 209.21.0.0/16 le 32
!
route-map PREFER-R1 permit 10 
 match ip address prefix-list EXTERNAS
 set local-preference 200
!
route-map PREFER-R1 permit 20 
 set local-preference 100
!
!
!
!
control-plane
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
 transport input ssh
!
!
!
!
end



