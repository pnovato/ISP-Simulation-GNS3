
!
version 17.12
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname DCR1
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
!
!
clock timezone WET 0 0
no ip icmp rate-limit unreachable
!
!
!
!
!
!
!
!
!
!
no ip domain lookup
no ip cef
login on-success log
no ipv6 cef
!
!
!
!
!
!
!
!
multilink bundle-name authenticated
!
!
crypto pki trustpoint TP-self-signed-2048013
 enrollment selfsigned
 subject-name cn=IOS-Self-Signed-Certificate-2048013
 revocation-check none
 rsakeypair TP-self-signed-2048013
 hash sha256
!
!
crypto pki certificate chain TP-self-signed-2048013
 certificate self-signed 01 nvram:IOS-Self-Sig#1.cer
!
!
memory free low-watermark processor 55011
!
!
spanning-tree mode rapid-pvst
!
!
!
!
!
!
!
! 
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 ip address 8.8.8.8 255.255.255.255
!
interface Ethernet0/0
 ip address 209.20.3.2 255.255.255.0
 ip nat outside
!
interface Ethernet0/1
 ip address 40.0.0.1 255.255.255.0
 ip nat inside
!
interface Ethernet0/2
 no ip address
 shutdown
!
interface Ethernet0/3
 no ip address
 shutdown
!
interface Ethernet1/0
 no ip address
 shutdown
!
interface Ethernet1/1
 no ip address
 shutdown
!
interface Ethernet1/2
 no ip address
 shutdown
!
interface Ethernet1/3
 no ip address
 shutdown
!
interface Serial2/0
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial2/1
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial2/2
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial2/3
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial3/0
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial3/1
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial3/2
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial3/3
 no ip address
 shutdown
 serial restart-delay 0
!
router bgp 65002
 bgp log-neighbor-changes
 network 40.0.0.0 mask 255.255.255.0
 neighbor 209.20.3.1 remote-as 12353
!
ip forward-protocol nd
!
ip tcp synwait-time 5
!
ip http server
ip http secure-server
ip nat inside source static tcp 40.0.0.10 80 209.20.3.2 8000 extendable
ip nat inside source static tcp 40.0.0.11 80 209.20.3.2 8080 extendable
ip route 0.0.0.0 0.0.0.0 209.20.3.1
ip ssh bulk-mode 131072
!
!
!
!
!
control-plane
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
 transport input ssh
!
!
!
!
end
